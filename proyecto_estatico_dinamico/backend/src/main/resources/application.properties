spring.application.name=auth-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:c29tZXZlcnlsb25nc2VjcmV0a2V5dGhhdGlzYXRsZWFzdDI1NmJpdHNsb25n}
app.jwt.expiration=86400000
app.jwt.pre-auth-expiration=120000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=8080
