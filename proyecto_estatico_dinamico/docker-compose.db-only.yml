version: '3.9'

# Levanta SOLO la base de datos.
# Útil cuando quieres correr el backend desde IntelliJ/Maven
# y solo necesitas PostgreSQL en Docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: authapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
