server:
  port: 8084

spring:
  application:
    name: mission-service
  datasource:
    url: jdbc:postgresql://localhost:5432/missiondb
    username: missionuser
    password: missionpass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: mission-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  public-key-path: classpath:certs/public.pem

# Timeouts acordados (Nivel 1 — sobreescribibles por env vars)
mission:
  unattended:
    timeout:
      critical: 5
      high: 15
      medium: 30
      low: 60

# Pesos algoritmo de selección
drone-selection:
  weights:
    battery: 0.35
    distance: 0.30
    mission-type: 0.25
    availability: 0.10
  min-score: 40
  max-distance-km: 50

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
