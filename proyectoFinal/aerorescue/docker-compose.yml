    # restart: unless-stopped

  # ══════════════════════════════════════════════════
  # FRONTEND
  # ══════════════════════════════════════════════════

  frontend:
    build:
      context: ../aerorescue-frontend
      dockerfile: Dockerfile
    container_name: aerorescue-frontend
    networks: [aerorescue-net]
    depends_on:
      - api-gateway
      - notification-service
    ports:
      - "80:80"
    restart: unless-stopped
