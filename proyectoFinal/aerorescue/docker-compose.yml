      context: .
      dockerfile: notification-service/Dockerfile
    container_name: aerorescue-notification-service
    networks: [aerorescue-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
    restart: unless-stopped

