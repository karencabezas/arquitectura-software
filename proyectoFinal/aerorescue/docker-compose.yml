networks:
  aerorescue-net:
    driver: bridge

volumes:
  auth-db-data:
  emergency-db-data:
  drone-db-data:
  mission-db-data:
  alert-db-data:
  audit-db-data:
  kafka-data:

services:

  # ══════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aerorescue-zookeeper
    networks: [aerorescue-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aerorescue-kafka
    networks: [aerorescue-net]
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aerorescue-kafka-ui
    networks: [aerorescue-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aerorescue
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── Databases ───────────────────────────────────────

  auth-db:
    image: postgres:15-alpine
    container_name: aerorescue-auth-db
    networks: [aerorescue-net]
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  emergency-db:
    image: postgres:15-alpine
    container_name: aerorescue-emergency-db
    networks: [aerorescue-net]
    volumes:
      - emergency-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: emergencydb
      POSTGRES_USER: emergencyuser
      POSTGRES_PASSWORD: emergencypass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergencyuser -d emergencydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  drone-db:
    image: postgres:15-alpine
    container_name: aerorescue-drone-db
    networks: [aerorescue-net]
    volumes:
      - drone-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dronedb
      POSTGRES_USER: droneuser
      POSTGRES_PASSWORD: dronepass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d dronedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  mission-db:
    image: postgres:15-alpine
    container_name: aerorescue-mission-db
    networks: [aerorescue-net]
    volumes:
      - mission-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: missiondb
      POSTGRES_USER: missionuser
      POSTGRES_PASSWORD: missionpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionuser -d missiondb"]
      interval: 10s
      timeout: 5s
      retries: 5

