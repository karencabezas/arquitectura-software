  # ══════════════════════════════════════════════════
  # MICROSERVICES
  # ══════════════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: aerorescue-auth-service
    networks: [aerorescue-net]
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PRIVATE_KEY_PATH: classpath:certs/private.pem
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRATION_HOURS: 8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 150s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: aerorescue-api-gateway
    networks: [aerorescue-net]
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
    restart: unless-stopped

  emergency-service:
    build:
      context: .
      dockerfile: emergency-service/Dockerfile
    container_name: aerorescue-emergency-service
    networks: [aerorescue-net]
    depends_on:
      emergency-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://emergency-db:5432/emergencydb
      SPRING_DATASOURCE_USERNAME: emergencyuser
      SPRING_DATASOURCE_PASSWORD: emergencypass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 150s

  drone-service:
    build:
      context: .
      dockerfile: drone-service/Dockerfile
    container_name: aerorescue-drone-service
    networks: [aerorescue-net]
    depends_on:
      drone-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://drone-db:5432/dronedb
      SPRING_DATASOURCE_USERNAME: droneuser
      SPRING_DATASOURCE_PASSWORD: dronepass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
      DRONE_HEARTBEAT_WARNING_THRESHOLD_SECONDS: 15
      DRONE_HEARTBEAT_OFFLINE_THRESHOLD_SECONDS: 999
      DRONE_HEARTBEAT_CHECK_INTERVAL_MS: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 150s

  mission-service:
    build:
      context: .
      dockerfile: mission-service/Dockerfile
    container_name: aerorescue-mission-service
    networks: [aerorescue-net]
    depends_on:
      mission-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://mission-db:5432/missiondb
      SPRING_DATASOURCE_USERNAME: missionuser
      SPRING_DATASOURCE_PASSWORD: missionpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
      MISSION_UNATTENDED_TIMEOUT_CRITICAL: 5
      MISSION_UNATTENDED_TIMEOUT_HIGH: 15
      MISSION_UNATTENDED_TIMEOUT_MEDIUM: 30
      MISSION_UNATTENDED_TIMEOUT_LOW: 60
      DRONE_SELECTION_WEIGHTS_BATTERY: 0.35
      DRONE_SELECTION_WEIGHTS_DISTANCE: 0.30
      DRONE_SELECTION_WEIGHTS_MISSION_TYPE: 0.25
      DRONE_SELECTION_WEIGHTS_AVAILABILITY: 0.10
      DRONE_SELECTION_MIN_SCORE: 40
      DRONE_SELECTION_MAX_DISTANCE_KM: 50
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8084 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 150s

